name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Structural checks
        shell: pwsh
        run: ./Tests/Test-Module.ps1

      - name: Name normaliser against winget's own corpus
        shell: pwsh
        run: ./Tests/Test-Normalizer.ps1
